# Build, test and deploy all four sites to cPanel over FTPS on every push to main.
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER     e.g. ftp.baitaandessigns.com, or the server hostname from cPanel
#   FTP_USERNAME   e.g. deploy@baitaandessigns.com
#   FTP_PASSWORD
#
# Required repository variables (same page → Variables): the folder for each site,
# relative to the FTP account's home folder, each ending in "/". There are no defaults on
# purpose: this cPanel also hosts maafstudios.com in public_html, which must never be touched.
#   FTP_DIR_ROOT   e.g. root/
#   FTP_DIR_ES     e.g. es/
#   FTP_DIR_PT     e.g. pt/
#   FTP_DIR_AR     e.g. ar/
#
# Optional repository variables:
#   FTP_PROTOCOL   default ftps (use ftp only if the host has no FTPS)
#   FTP_PORT       default 21
#   FTP_SECURITY   default strict (set loose only if FTPS fails with a certificate error)
#   PUBLIC_ADSENSE_CLIENT   ca-pub-… once AdSense approves the site; empty means no ads
#   PUBLIC_AD_PLACEHOLDERS  "off" hides the grey ad-place boxes shown while there are no real ads
#
# Until the secrets and folder variables exist, the workflow still builds and tests, and skips deployment.

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' && vars.FTP_DIR_ROOT != '' && vars.FTP_DIR_ES != '' && vars.FTP_DIR_PT != '' && vars.FTP_DIR_AR != '' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # Install exactly the pnpm version pinned in package.json ("packageManager").
      - name: Set up pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")" && pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test calculators
        run: pnpm test

      - name: Check translations
        run: pnpm check:i18n

      - name: Check for design slop (impeccable)
        run: pnpm check:design

      - name: Build all sites
        run: pnpm build
        env:
          # Ads stay off until this repository variable is set (after AdSense approval).
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_AD_PLACEHOLDERS: ${{ vars.PUBLIC_AD_PLACEHOLDERS }}

      - name: Check build output
        run: |
          for s in root es pt ar; do
            test -f "sites/$s/dist/index.html" || { echo "::error::sites/$s/dist/index.html missing"; exit 1; }
            test -f "sites/$s/dist/.htaccess" || { echo "::error::sites/$s/dist/.htaccess missing"; exit 1; }
            test -f "sites/$s/dist/404.html" || { echo "::error::sites/$s/dist/404.html missing"; exit 1; }
            echo "$s: $(find "sites/$s/dist" -type f | wc -l) files"
          done
          for s in es pt ar; do
            test -f "sites/$s/dist/en/index.html" || { echo "::error::sites/$s/dist/en/index.html missing"; exit 1; }
            test -f "sites/$s/dist/en/.htaccess" || { echo "::error::sites/$s/dist/en/.htaccess missing"; exit 1; }
          done

      - name: Deployment skipped
        if: env.HAS_FTP != 'true'
        run: |
          echo "::notice::Nothing was uploaded. Add the secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD and the variables FTP_DIR_ROOT, FTP_DIR_ES, FTP_DIR_PT, FTP_DIR_AR to deploy."

      - name: Refuse unsafe folders
        if: env.HAS_FTP == 'true'
        env:
          DIRS: ${{ vars.FTP_DIR_ROOT }} ${{ vars.FTP_DIR_ES }} ${{ vars.FTP_DIR_PT }} ${{ vars.FTP_DIR_AR }}
        run: |
          for d in $DIRS; do
            case "$d" in
              */) ;;
              *) echo "::error::Folder '$d' must end with /"; exit 1 ;;
            esac
            case "$d" in
              public_html/|./|/|public_html/es*|public_html/pt*|public_html/ar*)
                echo "::error::Folder '$d' is not allowed: public_html is maafstudios.com. Use a separate folder such as baitaan/root/."; exit 1 ;;
            esac
          done

      - name: Deploy baitaandessigns.com
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: sites/root/dist/
          server-dir: ${{ vars.FTP_DIR_ROOT }}
          log-level: minimal

      - name: Deploy es.baitaandessigns.com
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: sites/es/dist/
          server-dir: ${{ vars.FTP_DIR_ES }}
          log-level: minimal

      - name: Deploy pt.baitaandessigns.com
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: sites/pt/dist/
          server-dir: ${{ vars.FTP_DIR_PT }}
          log-level: minimal

      - name: Deploy ar.baitaandessigns.com
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: sites/ar/dist/
          server-dir: ${{ vars.FTP_DIR_AR }}
          log-level: minimal

      - name: Summary
        if: env.HAS_FTP == 'true'
        run: |
          {
            echo "### Deployed"
            echo "- https://baitaandessigns.com"
            echo "- https://es.baitaandessigns.com"
            echo "- https://pt.baitaandessigns.com"
            echo "- https://ar.baitaandessigns.com"
          } >> "$GITHUB_STEP_SUMMARY"
